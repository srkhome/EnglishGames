<style>
  #mole-game-root {
    --sky: #bfe6f5;
    --grass: #6fae4f;
    --grass-dark: #558a3d;
    --dirt: #7a5233;
    --dirt-dark: #5c3d26;
    --mole-body: #8b7256;
    --mole-belly: #d9c7a8;
    --paper: #fffaf0;
    --ink: #33281c;
    --red: #e0523f;
    --orange: #f2884b;
    --leaf: #4a7c4e;
    font-family: 'Baloo 2', 'Fredoka', 'Comic Sans MS', sans-serif;
    background: linear-gradient(180deg, var(--sky) 0%, var(--sky) 70px, var(--grass) 70px, var(--grass-dark) 100%);
    border-radius: 20px;
    padding: 18px 16px 24px;
    color: var(--ink);
    max-width: 640px;
    margin: 0 auto;
    box-sizing: border-box;
    position: relative;
    overflow: hidden;
  }
  #mole-game-root * { box-sizing: border-box; }

  .mg-header { text-align: center; margin-bottom: 8px; }
  .mg-title { font-size: 25px; font-weight: 800; color: #2f4a20; margin: 0; text-shadow: 0 1px 0 rgba(255,255,255,0.4); }
  .mg-subtitle { font-size: 13px; color: #2f4a20; opacity: 0.85; margin-top: 2px; }

  .mg-controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; margin: 12px 0 10px; }
  .mg-control-group { display: flex; align-items: center; gap: 6px; background: var(--paper); border: 2px solid var(--dirt); border-radius: 999px; padding: 5px 10px 5px 12px; }
  .mg-control-label { font-size: 12px; font-weight: 700; color: var(--dirt-dark); }
  .mg-select { border: none; background: transparent; font-family: inherit; font-size: 13px; font-weight: 700; color: var(--dirt-dark); padding: 4px 6px; cursor: pointer; }
  .mg-level-btns { display: flex; gap: 4px; }
  .mg-level-btn { border: none; border-radius: 999px; padding: 5px 12px; font-size: 12px; font-weight: 700; cursor: pointer; background: transparent; color: var(--dirt-dark); }
  .mg-level-btn.active { background: var(--leaf); color: white; }
  .mg-level-btn[data-level="hard"].active { background: var(--red); }
  .mg-level-btn[data-level="medium"].active { background: var(--orange); }

  .mg-stats { display: flex; justify-content: center; gap: 10px; margin: 6px 0 14px; }
  .mg-pill { background: var(--paper); border: 2px solid var(--dirt); border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 700; color: var(--dirt-dark); display: flex; align-items: center; gap: 6px; }

  .mg-prompt-row { display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 10px; }
  .mg-prompt {
    background: var(--paper);
    border: 3px solid var(--dirt);
    border-radius: 16px;
    padding: 10px 22px;
    font-size: 20px;
    font-weight: 800;
    color: var(--dirt-dark);
    min-width: 140px;
    text-align: center;
  }
  .mg-replay-btn {
    background: var(--paper);
    border: 2px solid var(--dirt);
    border-radius: 999px;
    width: 40px;
    height: 40px;
    font-size: 18px;
    cursor: pointer;
  }

  .mg-timebar-wrap {
    background: rgba(255,255,255,0.5);
    border-radius: 999px;
    height: 10px;
    margin: 0 auto 16px;
    max-width: 360px;
    overflow: hidden;
    border: 1px solid rgba(0,0,0,0.1);
  }
  .mg-timebar {
    height: 100%;
    background: linear-gradient(90deg, #7fd858, #f0b429);
    width: 100%;
    transition: width linear;
  }

  .mg-playfield { position: relative; }

  .mg-field {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    max-width: 420px;
    margin: 0 auto;
  }

  .mg-hole {
    position: relative;
    aspect-ratio: 1 / 0.85;
    cursor: pointer;
  }

  .mg-hole-dirt {
    position: absolute;
    left: 50%;
    bottom: 0;
    transform: translateX(-50%);
    width: 92%;
    height: 55%;
    background: radial-gradient(ellipse at center, var(--dirt) 0%, var(--dirt-dark) 100%);
    border-radius: 50%;
    box-shadow: inset 0 6px 10px rgba(0,0,0,0.35);
  }

  .mg-mole {
    position: absolute;
    left: 50%;
    bottom: 8%;
    transform: translate(-50%, 100%);
    width: 78%;
    aspect-ratio: 1/1;
    background: var(--mole-body);
    border-radius: 50% 50% 45% 45%;
    transition: transform 0.25s cubic-bezier(.3,1.5,.4,1);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    box-shadow: inset 0 -6px 0 rgba(0,0,0,0.15);
  }

  .mg-hole.up .mg-mole { transform: translate(-50%, 6%); }
  .mg-hole.hit .mg-mole { transform: translate(-50%, 100%) scale(0.8); transition: transform 0.2s ease-in; }
  .mg-hole.miss .mg-mole { transform: translate(-50%, 100%); }

  .mg-mole-belly {
    width: 60%;
    height: 45%;
    background: var(--mole-belly);
    border-radius: 50%;
    position: absolute;
    bottom: 8%;
  }

  .mg-mole-content {
    position: relative;
    z-index: 2;
    text-align: center;
    padding-top: 4px;
  }

  .mg-mole-emoji { font-size: 22px; line-height: 1; }
  .mg-mole-zh { font-size: 11px; font-weight: 800; color: #3a2b1e; background: rgba(255,255,255,0.85); border-radius: 6px; padding: 1px 4px; margin-top: 2px; }

  .mg-hole.correct-reveal .mg-mole { box-shadow: 0 0 0 4px #ffd54a, inset 0 -6px 0 rgba(0,0,0,0.15); }

  .mg-hole.hit .mg-mole-content::after { content: "✨"; position: absolute; top: -14px; left: 50%; transform: translateX(-50%); font-size: 18px; }

  .mg-footer { display: flex; justify-content: center; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  .mg-btn { background: var(--leaf); color: white; border: none; border-radius: 999px; padding: 10px 22px; font-size: 14px; font-weight: 700; cursor: pointer; box-shadow: 0 3px 0 #375c3a; }
  .mg-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #375c3a; }
  .mg-btn.secondary { background: var(--paper); color: var(--dirt-dark); box-shadow: 0 3px 0 var(--dirt); border: 2px solid var(--dirt); }

  .mg-win-overlay { position: absolute; inset: 0; background: rgba(255, 250, 240, 0.97); display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; border-radius: 20px; padding: 20px; z-index: 5; }
  .mg-win-overlay.show { display: flex; }
  .mg-win-emoji { font-size: 48px; margin-bottom: 8px; }
  .mg-win-title { font-size: 24px; font-weight: 800; color: var(--dirt-dark); margin: 0 0 4px; }
  .mg-win-sub { font-size: 14px; color: #5a6b4f; margin-bottom: 16px; }
  .mg-stars { font-size: 26px; margin-bottom: 12px; letter-spacing: 4px; }

  .mg-start-overlay { position: absolute; inset: 0; background: rgba(255, 250, 240, 0.97); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; border-radius: 20px; padding: 20px; z-index: 6; }
  .mg-start-overlay.hide { display: none; }
</style>

<div id="mole-game-root">
  <div class="mg-header">
    <p class="mg-title">單字打地鼠 🔨</p>
    <p class="mg-subtitle">聽到英文單字，打對意思的地鼠洞！</p>
  </div>

  <div class="mg-controls">

      <span class="mg-control-label">主題</span>
      <select class="mg-select" id="mg-topic"></select>
    </div>

      <div class="mg-level-btns" id="mg-levels">

        <button class="mg-level-btn" data-level="medium">高級</button>
        <button class="mg-level-btn" data-level="hard">困難</button>

    </div>
  </div>

  <div class="mg-stats">

  <div class="mg-prompt-row">

    <button class="mg-replay-btn" id="mg-replay" title="再聽一次">🔊</button>

  <div class="mg-timebar-wrap"><div class="mg-timebar" id="mg-timebar"></div></div>

  <div class="mg-playfield" id="mg-playfield">
    <div class="mg-field" id="mg-field"></div>

    <div class="mg-win-overlay" id="mg-win">

      <p class="mg-win-title">遊戲結束！</p>
      <div class="mg-stars" id="mg-stars"></div>
      <p class="mg-win-sub" id="mg-win-detail"></p>
      <button class="mg-btn" id="mg-play-again">再玩一次</button>

    <div class="mg-start-overlay" id="mg-start">

      <p class="mg-win-title">準備好了嗎？</p>
      <p class="mg-win-sub">選好上面的主題和難度，再點下面開始</p>
      <button class="mg-btn" id="mg-start-btn">開始遊戲</button>
    </div>
  </div>

  <div class="mg-footer">
    <button class="mg-btn secondary" id="mg-restart">重新開始</button>
  </div>
</div>

  let score = 0, round = 0, streak = 0, bestStreak = 0;
  let roundActive = false;
  let currentTarget = null;
  let holeAssignments = [];
  let timerStart = 0;
  let timerDuration = 0;
  let rafId = null;
  let timeoutId = null;
  let wordPool = [];

  Object.keys(TOPICS).forEach((key) => {
    const opt = document.createElement("option");
    opt.value = key;
    opt.textContent = TOPICS[key].label;
    topicSelect.appendChild(opt);
  });
  topicSelect.value = currentTopic;

  function setActiveLevelBtn() {
    Array.from(levelBtnsWrap.children).forEach((btn) => {
      btn.classList.toggle("active", btn.dataset.level === currentLevel);
    });
  }
  setActiveLevelBtn();

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function speak(word) {
    try {
      const u = new SpeechSynthesisUtterance(word);
      u.lang = "en-US";
      u.rate = 0.82;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }

  function buildField() {
    fieldEl.innerHTML = "";
    for (let i = 0; i < HOLE_COUNT; i++) {
      const hole = document.createElement("div");
      hole.className = "mg-hole";
      hole.dataset.index = i;
      hole.innerHTML = `
        <div class="mg-hole-dirt"></div>
        <div class="mg-mole">
          <div class="mg-mole-belly"></div>
          <div class="mg-mole-content"></div>
        </div>`;
      hole.addEventListener("click", () => onHoleClick(i, hole));
      fieldEl.appendChild(hole);
    }
  }

  function resetStats() {
    score = 0; round = 0; streak = 0; bestStreak = 0;
    scoreEl.textContent = "0";
    roundEl.textContent = "0";
    streakEl.textContent = "0";
    totalRoundsEl.textContent = String(LEVELS[currentLevel].rounds);
  }

  function newGame() {
    resetStats();
    wordPool = shuffle(TOPICS[currentTopic].words);
    buildField();
    winOverlay.classList.remove("show");
    startOverlay.classList.remove("hide");
  }

  function nextWordFromPool() {
    if (wordPool.length === 0) wordPool = shuffle(TOPICS[currentTopic].words);
    return wordPool.pop();
  }

  function startRound() {
    if (round >= LEVELS[currentLevel].rounds) {
      endGame();
      return;
    }
    round += 1;
    roundEl.textContent = String(round);

    const level = LEVELS[currentLevel];
    const holesToFill = Math.min(level.holes, HOLE_COUNT, TOPICS[currentTopic].words.length);

    currentTarget = nextWordFromPool();
    const others = shuffle(TOPICS[currentTopic].words.filter(w => w.en !== currentTarget.en)).slice(0, holesToFill - 1);
    const roundWords = shuffle([currentTarget, ...others]);

    const holePositions = shuffle([...Array(HOLE_COUNT).keys()]).slice(0, roundWords.length);
    holeAssignments = new Array(HOLE_COUNT).fill(null);
    holePositions.forEach((pos, idx) => { holeAssignments[pos] = roundWords[idx]; });

    Array.from(fieldEl.children).forEach((hole, idx) => {
      hole.classList.remove("hit", "miss", "correct-reveal", "up");
      const content = hole.querySelector(".mg-mole-content");
      const word = holeAssignments[idx];
      if (word) {
        if (word.emoji) {
          content.innerHTML = `<div class="mg-mole-emoji">${word.emoji}</div><div class="mg-mole-zh">${word.zh}</div>`;
        } else {
          content.innerHTML = `<div class="mg-mole-zh" style="font-size:12px;">${word.zh}</div>`;
        }
        hole.dataset.isCorrect = word.en === currentTarget.en ? "1" : "0";
        setTimeout(() => hole.classList.add("up"), 20 + idx * 10);
      } else {
        content.innerHTML = "";
        hole.dataset.isCorrect = "0";
      }
    });

    promptEl.textContent = currentTarget.en;
    speak(currentTarget.en);

    roundActive = true;
    timerDuration = level.timeMs;
    timebarEl.style.transition = "none";
    timebarEl.style.width = "100%";
    requestAnimationFrame(() => {
      timebarEl.style.transition = `width ${timerDuration}ms linear`;
      timebarEl.style.width = "0%";
    });

    clearTimeout(timeoutId);
    timeoutId = setTimeout(() => onRoundTimeout(), timerDuration);
  }

  function onHoleClick(idx, hole) {
    if (!roundActive) return;
    const word = holeAssignments[idx];
    if (!word) return;

    if (word.en === currentTarget.en) {
      roundActive = false;
      clearTimeout(timeoutId);
      hole.classList.add("hit");
      score += 10 + Math.min(streak, 5) * 2;
      streak += 1;
      bestStreak = Math.max(bestStreak, streak);
      scoreEl.textContent = String(score);
      streakEl.textContent = String(streak);
      setTimeout(() => startRound(), 700);
    } else {
      hole.classList.add("miss");
      streak = 0;
      streakEl.textContent = "0";
      score = Math.max(0, score - 3);
      scoreEl.textContent = String(score);
    }
  }

  function onRoundTimeout() {
    roundActive = false;
    streak = 0;
    streakEl.textContent = "0";
    Array.from(fieldEl.children).forEach((hole) => {
      if (hole.dataset.isCorrect === "1") hole.classList.add("correct-reveal");
    });
    setTimeout(() => startRound(), 900);
  }

  function endGame() {
    const total = LEVELS[currentLevel].rounds;
    const pct = total > 0 ? score / (total * 10) : 0;
    let stars = "⭐";
    if (pct >= 0.6) stars = "⭐⭐";
    if (pct >= 1.0) stars = "⭐⭐⭐";
    starsEl.textContent = stars;
    winDetail.textContent = `${TOPICS[currentTopic].label}・${LEVELS[currentLevel].label} — 總分 ${score}，最高連擊 ${bestStreak}！`;
    winOverlay.classList.add("show");
  }

  startBtn.addEventListener("click", () => {
    startOverlay.classList.add("hide");
    startRound();
  });
  playAgainBtn.addEventListener("click", () => newGame());
  restartBtn.addEventListener("click", () => newGame());
  replayBtn.addEventListener("click", () => { if (currentTarget) speak(currentTarget.en); });

  topicSelect.addEventListener("change", () => { currentTopic = topicSelect.value; newGame(); });
  levelBtnsWrap.addEventListener("click", (e) => {
    const btn = e.target.closest(".mg-level-btn");
    if (!btn) return;
    currentLevel = btn.dataset.level;
    setActiveLevelBtn();
    newGame();
  });

  newGame();
})();
</script>

</body>
</html>
