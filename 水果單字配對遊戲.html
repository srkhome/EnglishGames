<body>
<style>
  #fruit-game-root {
    --wood: #7a5233;
    --wood-dark: #5c3d26;
    --crate: #e8c8a0;
    --crate-light: #f6e6cf;
    --leaf: #4a7c4e;
    --leaf-light: #8fc78f;
    --red: #e0523f;
    --yellow: #f0b429;
    --orange: #f2884b;
    --purple: #8e6bb0;
    --ink: #3a2b1e;
    --paper: #fffaf0;
    font-family: 'Baloo 2', 'Fredoka', 'Comic Sans MS', sans-serif;
    background: linear-gradient(180deg, #cfe8cf 0%, #cfe8cf 120px, var(--crate-light) 120px);
    border-radius: 20px;
    padding: 20px 18px 26px;
    color: var(--ink);
    max-width: 680px;
    margin: 0 auto;
    box-sizing: border-box;
    position: relative;
    overflow: hidden;
  }

  #fruit-game-root * { box-sizing: border-box; }

  .fg-header { text-align: center; margin-bottom: 10px; }

  .fg-title { font-size: 26px; font-weight: 800; color: var(--wood-dark); margin: 0; letter-spacing: 0.5px; }
  .fg-subtitle { font-size: 13px; color: #5a6b4f; margin-top: 2px; }

  .fg-controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    align-items: center;
    margin: 14px 0 10px;
  }

  .fg-control-group {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--paper);
    border: 2px solid var(--crate);
    border-radius: 999px;
    padding: 5px 10px 5px 12px;
  }

  .fg-control-label { font-size: 12px; font-weight: 700; color: var(--wood-dark); }

  .fg-select {
    border: none;
    background: transparent;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    color: var(--wood-dark);
    padding: 4px 6px;
    cursor: pointer;
  }

  .fg-level-btns { display: flex; gap: 4px; }

  .fg-level-btn {
    border: none;
    border-radius: 999px;
    padding: 5px 12px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    background: transparent;
    color: var(--wood-dark);
  }

  .fg-level-btn.active { background: var(--leaf); color: white; }
  .fg-level-btn[data-level="hard"].active { background: var(--red); }
  .fg-level-btn[data-level="medium"].active { background: var(--orange); }

  .fg-stats { display: flex; justify-content: center; gap: 10px; margin: 6px 0 16px; }

  .fg-pill {
    background: var(--paper);
    border: 2px solid var(--crate);
    border-radius: 999px;
    padding: 6px 16px;
    font-size: 14px;
    font-weight: 700;
    color: var(--wood-dark);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .fg-board {
    display: grid;
    gap: 9px;
    justify-content: center;
  }

  .fg-card { width: 82px; aspect-ratio: 1 / 1; border-radius: 14px; cursor: pointer; position: relative; perspective: 600px; -webkit-tap-highlight-color: transparent; }
  @media (max-width: 480px) { .fg-card { width: 68px; } }

  .fg-card-inner { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform 0.45s cubic-bezier(.2,.9,.3,1.2); }

  .fg-card.flipped .fg-card-inner, .fg-card.matched .fg-card-inner { transform: rotateY(180deg); }

  .fg-face { position: absolute; inset: 0; border-radius: 14px; display: flex; align-items: center; justify-content: center; backface-visibility: hidden; }

  .fg-face-back { background: linear-gradient(160deg, var(--wood) 0%, var(--wood-dark) 100%); box-shadow: inset 0 -4px 0 rgba(0,0,0,0.25), 0 3px 0 rgba(0,0,0,0.15); font-size: 24px; }
  .fg-face-back::after { content: "🧺"; opacity: 0.9; }

  .fg-face-front { background: var(--paper); transform: rotateY(180deg); flex-direction: column; gap: 4px; box-shadow: 0 3px 0 rgba(0,0,0,0.08); border: 3px solid var(--crate); padding: 4px; text-align: center; }

  .fg-card.matched .fg-face-front { border-color: var(--leaf); background: #f2fbf0; }

  .fg-emoji { font-size: 26px; line-height: 1; }
  .fg-word { font-size: 12px; font-weight: 800; color: var(--wood-dark); text-align: center; line-height: 1.15; }
  .fg-zh { font-size: 10px; color: #8a9482; }

  .fg-card.shake .fg-card-inner { animation: fg-shake 0.35s; }
  @keyframes fg-shake { 0%, 100% { transform: rotateY(0deg) translateX(0); } 25% { transform: rotateY(0deg) translateX(-6px); } 75% { transform: rotateY(0deg) translateX(6px); } }
  .fg-card.matched .fg-card-inner { animation: fg-pop 0.5s; }
  @keyframes fg-pop { 0% { transform: rotateY(180deg) scale(1); } 50% { transform: rotateY(180deg) scale(1.12); } 100% { transform: rotateY(180deg) scale(1); } }

  .fg-footer { display: flex; justify-content: center; gap: 10px; margin-top: 18px; flex-wrap: wrap; }

  .fg-btn { background: var(--leaf); color: white; border: none; border-radius: 999px; padding: 10px 22px; font-size: 14px; font-weight: 700; cursor: pointer; box-shadow: 0 3px 0 #375c3a; transition: transform 0.1s; }
  .fg-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #375c3a; }
  .fg-btn.secondary { background: var(--paper); color: var(--wood-dark); box-shadow: 0 3px 0 var(--crate); border: 2px solid var(--crate); }

  .fg-win-overlay { position: absolute; inset: 0; background: rgba(255, 250, 240, 0.96); display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; border-radius: 20px; padding: 20px; z-index: 5; }
  .fg-win-overlay.show { display: flex; }
  .fg-win-emoji { font-size: 50px; margin-bottom: 8px; }
  .fg-win-title { font-size: 24px; font-weight: 800; color: var(--wood-dark); margin: 0 0 4px; }
  .fg-win-sub { font-size: 14px; color: #5a6b4f; margin-bottom: 16px; }
  .fg-stickers { display: flex; gap: 6px; font-size: 20px; margin-bottom: 14px; }

  .fg-playfield { position: relative; }
  .fg-start-overlay { position: absolute; inset: 0; background: rgba(255, 250, 240, 0.97); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; border-radius: 16px; padding: 20px; z-index: 6; }
  .fg-start-overlay.hide { display: none; }
</style>

<div id="fruit-game-root">
  <div class="fg-header">
    <p class="fg-title">單字配對遊戲</p>
    <p class="fg-subtitle">點兩張卡片，找出一樣的意思！</p>
  </div>

  <div class="fg-controls">
    <div class="fg-control-group">
      <span class="fg-control-label">主題</span>
      <select class="fg-select" id="fg-topic"></select>
    </div>
    <div class="fg-control-group">
      <span class="fg-control-label">難度</span>
      <div class="fg-level-btns" id="fg-levels">
        <button class="fg-level-btn" data-level="easy">普通</button>
        <button class="fg-level-btn" data-level="medium">高級</button>
        <button class="fg-level-btn" data-level="hard">困難</button>
      </div>
    </div>
  </div>

  <div class="fg-stats">
    <div class="fg-pill">⏱ <span id="fg-time">0</span>s</div>
    <div class="fg-pill">🔁 <span id="fg-moves">0</span> 次</div>
    <div class="fg-pill">✅ <span id="fg-found">0</span>/<span id="fg-total">0</span></div>
  </div>

  <div class="fg-playfield" id="fg-playfield">
    <div class="fg-board" id="fg-board"></div>

    <div class="fg-win-overlay" id="fg-win">
      <div class="fg-win-emoji">🏆</div>
      <p class="fg-win-title">全部配對成功！</p>
      <p class="fg-win-sub" id="fg-win-detail"></p>
      <div class="fg-stickers">🍎🍌🍇🍉🍓🍊🍋🍑</div>
      <button class="fg-btn" id="fg-play-again">再玩一次</button>
    </div>

    <div class="fg-start-overlay" id="fg-start">
      <div class="fg-win-emoji">🧺</div>
      <p class="fg-win-title">準備好了嗎？</p>
      <p class="fg-win-sub">選好上面的主題和難度，再點下面開始</p>
      <button class="fg-btn" id="fg-start-btn">開始遊戲</button>
    </div>
  </div>

  <div class="fg-footer">
    <button class="fg-btn" id="fg-restart">重新開始</button>
    <button class="fg-btn secondary" id="fg-speak-toggle">🔊 唸出來：開</button>
  </div>
</div>

    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function speak(word) {
    if (!speakOn) return;
    try {
      const u = new SpeechSynthesisUtterance(word);
      u.lang = "en-US";
      u.rate = 0.85;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }

  function startTimer() {
    stopTimer();
    seconds = 0;
    timeEl.textContent = "0";
    timerId = setInterval(() => {
      seconds += 1;
      timeEl.textContent = String(seconds);
    }, 1000);
  }

  function stopTimer() {
    if (timerId) clearInterval(timerId);
    timerId = null;
  }

  function pickWordSet() {
    const topicWords = TOPICS[currentTopic].words;
    const count = Math.min(LEVELS[currentLevel].count, topicWords.length);
    return shuffle(topicWords).slice(0, count);
  }

  function buildDeck(wordSet) {
    const pairs = [];
    wordSet.forEach((w, i) => {
      pairs.push({ pairId: i, ...w, kind: "word" });
      pairs.push({ pairId: i, ...w, kind: "clue" });
    });
    return shuffle(pairs);
  }

  function columnsForTotal(total) {
    if (total <= 12) return 4;   // 12 張 → 4x3
    if (total <= 18) return 6;   // 18 張 → 6x3
    return 6;                    // 24 張 → 6x4
  }

  function render() {
    boardEl.style.gridTemplateColumns = `repeat(${columnsForTotal(cards.length)}, 82px)`;
    boardEl.innerHTML = "";
    cards.forEach((card, idx) => {
      const cardEl = document.createElement("div");
      cardEl.className = "fg-card";
      cardEl.dataset.index = idx;

      const inner = document.createElement("div");
      inner.className = "fg-card-inner";

      const back = document.createElement("div");
      back.className = "fg-face fg-face-back";

      const front = document.createElement("div");
      front.className = "fg-face fg-face-front";
      if (card.kind === "clue") {
        if (card.emoji) {
          front.innerHTML = `<div class="fg-emoji">${card.emoji}</div><div class="fg-zh">${card.zh}</div>`;
        } else {
          front.innerHTML = `<div class="fg-word" style="font-size:15px;">${card.zh}</div>`;
        }
      } else {
        front.innerHTML = `<div class="fg-word">${card.en}</div>`;
      }

      inner.appendChild(back);
      inner.appendChild(front);
      cardEl.appendChild(inner);
      cardEl.addEventListener("click", () => onCardClick(idx, cardEl));
      boardEl.appendChild(cardEl);
    });
  }

  function onCardClick(idx, el) {
    if (locked) return;
    if (el.classList.contains("flipped") || el.classList.contains("matched")) return;
    if (flipped.length === 2) return;

    el.classList.add("flipped");
    flipped.push({ idx, el });

    const card = cards[idx];
    if (card.kind === "word") speak(card.en);

    if (flipped.length === 2) {
      moves += 1;
      movesEl.textContent = String(moves);
      const [a, b] = flipped;
      const cardA = cards[a.idx];
      const cardB = cards[b.idx];

      if (cardA.pairId === cardB.pairId) {
        locked = true;
        setTimeout(() => {
          a.el.classList.add("matched");
          b.el.classList.add("matched");
          matchedCount += 1;
          foundEl.textContent = String(matchedCount);
          flipped = [];
          locked = false;
          if (cardA.kind === "clue") speak(cardB.en); else speak(cardA.en);
          if (matchedCount === currentWordSet.length) {
            finishGame();
          }
        }, 350);
      } else {
        locked = true;
        a.el.classList.add("shake");
        b.el.classList.add("shake");
        const delay = LEVELS[currentLevel].delay;
        setTimeout(() => {
          a.el.classList.remove("flipped", "shake");
          b.el.classList.remove("flipped", "shake");
          flipped = [];
          locked = false;
        }, delay);
      }
    }
  }

  function finishGame() {
    stopTimer();
    winDetail.textContent = `${TOPICS[currentTopic].label}・${LEVELS[currentLevel].label} — 用了 ${seconds} 秒、${moves} 次配對！`;
    setTimeout(() => winOverlay.classList.add("show"), 400);
  }

  function newGame() {
    currentWordSet = pickWordSet();
    cards = buildDeck(currentWordSet);
    flipped = [];
    matchedCount = 0;
    moves = 0;
    locked = true;
    movesEl.textContent = "0";
    foundEl.textContent = "0";
    totalEl.textContent = String(currentWordSet.length);
    timeEl.textContent = "0";
    stopTimer();
    winOverlay.classList.remove("show");
    startOverlay.classList.remove("hide");
    render();
  }

  startBtn.addEventListener("click", () => {
    startOverlay.classList.add("hide");
    locked = false;
    startTimer();
  });

  document.getElementById("fg-restart").addEventListener("click", newGame);
  document.getElementById("fg-play-again").addEventListener("click", newGame);
  speakToggleBtn.addEventListener("click", () => {
    speakOn = !speakOn;
    speakToggleBtn.textContent = speakOn ? "🔊 唸出來：開" : "🔇 唸出來：關";
  });
  topicSelect.addEventListener("change", () => {
    currentTopic = topicSelect.value;
    newGame();
  });
  levelBtnsWrap.addEventListener("click", (e) => {
    const btn = e.target.closest(".fg-level-btn");
    if (!btn) return;
    currentLevel = btn.dataset.level;
    setActiveLevelBtn();
    newGame();
  });

  newGame();
})();
</script>

</body>
</html>
